<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <title>Is this a scam? · Scam Check</title>
    <meta name="description" content="Paste a suspicious message. You’ll know in seconds if you can trust it." />
    <!-- Link previews: crawlers don't run JavaScript, so one static version serves every language. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Scam Check" />
    <meta property="og:description" content="Is this a scam? · Ist das Betrug? · Apakah ini penipuan? · តើនេះជាការបោកប្រាស់ឬទេ?" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Figtree-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- vite.config.js adds the brand's colours (src/brand.js) here. -->
  </head>
  <body>
    <!-- Texts come from src/strings.js via the data-i18n attributes; the cartoons from src/scenes.js. -->
    <header class="hero">
      <div class="wrap">
        <div class="bar">
          <!-- The demo's neutral mark. An operator's logo goes in public/logo.svg; then give it alt text. -->
          <img class="logo" src="/logo.svg" alt="" width="32" height="32" />
          <span class="product" data-i18n="product"></span>
          <span class="badge">Demo</span>
          <!-- The native menu does the picking; the pill shows the current language's code (main.js fills both). -->
          <div class="lang">
            <span class="icon i-globe" aria-hidden="true"></span>
            <span class="lang-code" id="lang-code" aria-hidden="true"></span>
            <span class="icon i-chevron" aria-hidden="true"></span>
            <select id="lang" data-i18n-label="lang.label"></select>
          </div>
        </div>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
      </div>
    </header>

    <main class="wrap">
      <form class="card ask" id="form" novalidate>
        <div class="field">
          <label class="sr-only" for="message" data-i18n="form.label"></label>
          <textarea id="message" rows="4" data-i18n-placeholder="form.placeholder"></textarea>
          <!-- An attached screenshot takes the place of both tools: one at a time, removed with its ×. -->
          <div class="field-tools">
            <button type="button" class="tool" id="example" data-i18n="form.example"></button>
            <button type="button" class="tool tool-icon" id="upload" data-i18n-label="form.screenshot">
              <span class="icon i-camera" aria-hidden="true"></span>
            </button>
            <div class="shot" id="shot" hidden>
              <img id="shot-img" data-i18n-alt="form.shot" />
              <button type="button" class="shot-remove" id="shot-remove" data-i18n-label="form.remove">
                <span class="icon i-close" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <input type="file" id="picker" accept="image/*" hidden />
        </div>
        <p class="hint" id="hint" hidden data-i18n="form.empty"></p>
        <button type="submit" class="btn btn-primary" id="submit">
          <span class="icon i-search" aria-hidden="true"></span>
          <span id="submit-label" data-i18n="form.submit"></span>
        </button>
      </form>

      <!-- For screen readers: a screenshot added or removed, or a check under way. Outside the slot, which is often hidden. -->
      <p class="sr-only" id="status" role="status"></p>

      <!-- One slot next to (desktop) or below (phones) the form: checking, then the result (or the demo notice). -->
      <section class="slot" id="slot" hidden>
        <div class="card checking" id="progress" hidden>
          <div class="scene" id="checking-scene"></div>
          <p class="checking-text" id="progress-text" aria-hidden="true"></p>
        </div>

        <!-- The backend's answer: data-verdict on the card is scam, caution or legit. -->
        <div class="result" id="result" hidden>
          <article class="card verdict" id="verdict">
            <div class="verdict-head">
              <div class="verdict-art" id="verdict-art" hidden></div>
              <span class="verdict-icon" id="verdict-icon"><span class="icon i-warning" aria-hidden="true"></span></span>
              <p class="spotted" id="spotted" hidden></p>
            </div>
            <div class="verdict-body">
              <h2 id="headline" tabindex="-1"></h2>
              <p id="reason"></p>
              <h3 data-i18n="result.steps"></h3>
              <ol class="steps" id="steps"></ol>
              <p class="help" id="help"></p>
              <div class="feedback" id="feedback" aria-live="polite">
                <div class="feedback-row" data-step="ask">
                  <p data-i18n="feedback.ask"></p>
                  <button type="button" class="pill" data-rating="up">
                    <span class="icon i-thumb" aria-hidden="true"></span><span data-i18n="feedback.yes"></span>
                  </button>
                  <button type="button" class="pill" data-rating="down">
                    <span class="icon i-thumb down" aria-hidden="true"></span><span data-i18n="feedback.no"></span>
                  </button>
                </div>
                <div class="feedback-row" data-step="why" hidden>
                  <p data-i18n="feedback.why"></p>
                  <button type="button" class="pill" data-reason="wrong_verdict" data-i18n="feedback.wrong"></button>
                  <button type="button" class="pill" data-reason="unclear" data-i18n="feedback.unclear"></button>
                  <button type="button" class="pill" data-reason="not_helpful" data-i18n="feedback.useless"></button>
                </div>
                <p class="feedback-thanks" data-step="thanks" hidden>
                  <span class="icon i-tick" aria-hidden="true"></span><span data-i18n="feedback.thanks"></span>
                </p>
              </div>
            </div>
          </article>

          <aside class="card protect" id="protect" hidden>
            <div class="protect-art" id="protect-art"></div>
            <h2 data-i18n="protect.title"></h2>
            <p data-i18n="protect.text"></p>
            <!-- The operator's page about it: href from src/brand.js. -->
            <a class="btn btn-on-brand" id="protect-link" target="_blank" rel="noopener" data-i18n="protect.cta"></a>
          </aside>

          <section class="card trick" id="trick" hidden>
            <div class="story" id="trick-story"></div>
          </section>

          <aside class="card share" id="share" hidden>
            <h2 data-i18n="share.title"></h2>
            <p id="share-text"></p>
            <button type="button" class="btn btn-secondary" id="share-native" hidden>
              <span class="icon i-share" aria-hidden="true"></span>
              <span data-i18n="share.button"></span>
            </button>
            <div class="share-links" id="share-links" hidden>
              <a class="pill" id="share-app" target="_blank" rel="noopener" data-i18n="share.app"></a>
              <a class="pill" id="share-email" data-i18n="share.email"></a>
              <button type="button" class="pill" id="share-copy" data-i18n="share.copy"></button>
            </div>
          </aside>

          <button type="button" class="btn btn-tertiary" id="reset" data-i18n="reset"></button>
        </div>

        <!-- The demo's limit, or a check that failed (main.js sets the text and the button). -->
        <div class="card notice" id="notice" hidden>
          <span class="icon i-info" aria-hidden="true"></span>
          <p id="notice-text" tabindex="-1" data-i18n="notice.text"></p>
          <button type="button" class="btn btn-secondary" id="notice-example" data-i18n="form.example"></button>
          <button type="button" class="btn btn-secondary" id="notice-retry" data-i18n="notice.retry" hidden></button>
        </div>
      </section>

      <!-- The scam types as a row of cards that scrolls sideways (swipe, the arrows or the arrow keys). Filled by main.js.
           role="list": Safari drops the list role when list-style is none. -->
      <section class="types" id="types" aria-labelledby="types-title">
        <h2 id="types-title" data-i18n="types.title"></h2>
        <ul class="tiles" id="tiles" role="list" tabindex="0" aria-labelledby="types-title"></ul>
        <div class="tiles-nav">
          <button type="button" class="nav-btn" id="tiles-prev" data-i18n-label="types.prev">
            <span class="icon i-arrow-left" aria-hidden="true"></span>
          </button>
          <span class="tiles-bar" aria-hidden="true"><span id="tiles-thumb"></span></span>
          <button type="button" class="nav-btn" id="tiles-next" data-i18n-label="types.next">
            <span class="icon i-arrow-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
